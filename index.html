<!DOCTYPE html>
<html lang="en">
  <head>

    <link rel="icon" type="image/png" href="gppic1.png">
    <meta charset="UTF-8">
    <body style="color: #000000; font-size: 18px; line-height: 1.5;">
    <title>Genizyportal</title>
    
    <div class="header-search">
  

<style>
header {
  background: #004488;
  padding: 10px 24px;
  min-height: 105px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  position: relative;
  box-sizing: border-box;
}

.header-brand h1 {
  margin: 0;
  font-size: 36px;
}

.header-brand p {
  margin: 4px 0 0;
  color: #d9e8ff;
  font-size: 12px;
}

.header-search {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  background: white;
  border-radius: 7px;
  padding: 0 12px;
  width: 300px;
  max-width: 35%;
  box-sizing: border-box;
}

.header-search input {
  width: 100%;
  min-width: 0;
  padding: 10px 0;
  border: none;
  outline: none;
  background: transparent;
  color: #111;
  font-size: 14px;
}

@media (max-width: 550px) {
  header {
    min-height: auto;
    padding: 14px;
    flex-wrap: wrap;
  }

  .header-search {
    position: static;
    transform: none;
    width: 100%;
    max-width: 100%;
  }
}

</style> 
  </head>
  <body>

    
    <div class="header-bar">
      <span>🔍</span>
  <input
    id="search"
    type="search"
    placeholder="Search..."
    aria-label="Search"
  >
<h2> Genizyportal </h2>
<h3> BETA </h3>
  </body>
</html>
